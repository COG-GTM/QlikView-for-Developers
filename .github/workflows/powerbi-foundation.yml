name: Power BI foundation

on:
  pull_request:
  push:
    branches: [samuels-migration]
  workflow_dispatch:

jobs:
  convert-verify-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: powerbi/requirements.txt
      - name: Install mdbtools and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y mdbtools
          pip install -r powerbi/requirements.txt
      - name: Convert sources to Parquet
        run: python powerbi/tools/convert_sources.py
      - name: Catalog is up to date
        run: git diff --exit-code -- powerbi/data/catalog.json
      - name: Verify row counts (sources and inventory)
        run: python powerbi/tools/verify_conversion.py
      - name: Recompute KPIs from source for every app
        run: python powerbi/parity/harness.py source --all
      - name: Committed expected results, PBIPs and DAX queries are reproducible
        run: |
          python powerbi/tools/build_ch03_airline.py
          python powerbi/parity/harness.py queries --app "Chapter03__Solution_Chapter 3_Airline Operations" --pbip powerbi/apps/Chapter03_Airline_Operations
          python powerbi/tools/scaffold_pbip.py --app "Chapter04__Solution_Chapter 4_Airline Operations"
          python powerbi/tools/build_report.py --app "Chapter04__Solution_Chapter 4_Airline Operations" --pbip powerbi/apps/Chapter04_Airline_Operations
          python powerbi/parity/harness.py queries --app "Chapter04__Solution_Chapter 4_Airline Operations" --pbip powerbi/apps/Chapter04_Airline_Operations
          python powerbi/tools/build_airline_base.py
          python powerbi/tools/build_airline_ch11.py
          python powerbi/parity/harness.py queries --app "Chapter11__Solution_Chapter 11_Airline Operations" --pbip powerbi/apps/Chapter11_Airline_Operations
          python powerbi/tools/build_airline_ch06.py
          python powerbi/parity/harness.py queries --app "Chapter06__Solution_Chapter 6_Airline Operations" --pbip powerbi/apps/Chapter06_Airline_Operations
          python powerbi/parity/harness.py queries --app "Chapter15__Solution_Chapter 15_Airline Operations" --pbip powerbi/apps/Chapter15_Airline_Operations
          python powerbi/tools/build_airline_ch12.py
          python powerbi/parity/harness.py queries --app "Chapter12__Solution_Chapter 12_Airline Operations" --pbip powerbi/apps/Chapter12_Airline_Operations
          python powerbi/tools/build_ch07_airline.py
          python powerbi/parity/harness.py queries --app "Chapter07__Solution_Chapter 7_Airline Operations" --pbip powerbi/apps/Chapter07_Airline_Operations
          python powerbi/tools/build_airline_ch08.py
          python powerbi/parity/harness.py queries --app "Chapter08__Solution_Chapter 8_Airline Operations" --pbip powerbi/apps/Chapter08_Airline_Operations
          python powerbi/tools/build_ch09_concatenated_tables.py
          python powerbi/parity/harness.py queries --app "Chapter09__Solution_Chapter 9_Concatenated tables" --pbip powerbi/apps/Chapter09_Concatenated_tables
          python powerbi/parity/harness.py queries --app "Chapter13__Solution_Chapter 13_Airline Operations" --pbip powerbi/apps/Chapter13_Airline_Operations
          git status --porcelain -- powerbi/parity powerbi/apps
          git diff --exit-code -- powerbi/parity/expected powerbi/parity/dax powerbi/apps
          test -z "$(git status --porcelain --untracked-files=all -- powerbi/parity/dax powerbi/apps)"
      - name: Hand-built app parity artifacts are reproducible
        run: |
          python powerbi/parity/harness.py queries --app "Chapter10__Hierarchy example" --pbip powerbi/apps/Chapter10_Hierarchy_example
          git diff --exit-code -- powerbi/parity/expected powerbi/parity/dax
      - name: Tests
        working-directory: powerbi
        run: python -m pytest -q
      - name: Upload Parquet and parity outputs
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-parquet
          path: |
            powerbi/data/parquet
            powerbi/data/conversion_report.md
            powerbi/parity/expected
          retention-days: 14
